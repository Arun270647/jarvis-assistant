name: Website latest.json

# When a release is published, its latest.json becomes the website's /latest.json (website/public/latest.json), which
# the download page and the app's updater read; Vercel redeploys the site from the commit. Started by hand, it copies
# the given release's file (or the newest published one, pre-releases included).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: the newest published release)"
        required: false

permissions:
  contents: write            # commit website/public/latest.json

jobs:
  latest:
    name: Copy latest.json to the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Copy the release's latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'); fi
          gh release download "$TAG" --pattern latest.json --dir "$RUNNER_TEMP/latest" --clobber
          python3 - "$RUNNER_TEMP/latest/latest.json" <<'EOF'
          import json, sys
          latest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert latest.get("version") and any(latest.get(k, {}).get("url") for k in ("windows", "macos")), latest
          EOF
          cp "$RUNNER_TEMP/latest/latest.json" website/public/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/latest.json
          if git diff --cached --quiet; then echo "website/public/latest.json is already $TAG's"; exit 0; fi
          git commit -m "Website: latest.json for $TAG"
          git push origin HEAD:main
