name: Release

# A tag v* builds the Windows installer and the Mac disk image (Apple silicon), then drafts a GitHub Release with both,
# their SHA-256 sums and one latest.json (the updater's feed; publishing the release copies it to the website, see
# website-latest.yml). Versions with letters (0.1.0-alpha.1, 0.1.0.dev0) are marked as
# pre-releases. Publishing the draft is the maintainer's step.
# Started by hand (Actions › Release › Run workflow), it builds both and keeps them as downloadable artifacts; with
# "rehearse" ticked it also drafts a release named rehearsal-<run number> to check the whole path without a tag
# (delete that draft afterwards: gh release delete rehearsal-<n> --cleanup-tag --yes).
# Nothing is code-signed (no signing budget; the Mac app is signed ad hoc and not notarized); the SHA-256 and, once
# the repository is public, GitHub's build provenance let people check the download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Also draft a test release (rehearsal-<run number>) to check the release step"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meta:
    name: Version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: The tag matches the app's version
        shell: python
        env:
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          import os, re
          version = re.search(r'__version__\s*=\s*"([^"]+)"', open("src/version.py", encoding="utf-8").read()).group(1)
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag == "v" + version, f"tag {tag} but src/version.py says {version}"
              draft = True
          else:
              tag, draft = f"rehearsal-{os.environ['GITHUB_RUN_NUMBER']}", os.environ.get("REHEARSE") == "true"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\ntag={tag}\ndraft={str(draft).lower()}\nprerelease={str(bool(re.search('[a-z]', version))).lower()}\n")
          print(f"Jarvis {version}, release tag {tag}, draft a release: {draft}")

  windows:
    name: Windows installer
    needs: meta
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked packages
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Inno Setup 6 (the installer's compiler)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build the installer (runtime, app, launcher; checks, then a silent install of the result)
        run: >
          python packaging/build_windows.py --check-install
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}"
          --notes "https://github.com/${{ github.repository }}/releases/tag/${{ needs.meta.outputs.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-windows
          path: |
            dist/*.exe
            dist/*.sha256
            dist/latest.json
          retention-days: 14

  macos:
    name: Mac disk image (Apple silicon)
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked packages (the build renders the icon with Pillow and runs the updater's code)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Build Jarvis.app and its disk image (runtime, app, launcher, ad-hoc signature; checks included)
        run: >
          python packaging/build_macos.py
          --base-url "https://github.com/${{ github.repository }}/releases/download/${{ needs.meta.outputs.tag }}"
          --notes "https://github.com/${{ github.repository }}/releases/tag/${{ needs.meta.outputs.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-macos
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/latest.json
          retention-days: 14

  release:
    name: Draft the release
    if: needs.meta.outputs.draft == 'true'
    needs: [meta, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # draft the release
      id-token: write        # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: jarvis-windows
          path: windows
      - uses: actions/download-artifact@v7
        with:
          name: jarvis-macos
          path: macos
      - name: One latest.json for both systems
        shell: python
        run: |
          import json, pathlib
          latest = json.loads(pathlib.Path("windows/latest.json").read_text(encoding="utf-8"))
          mac = json.loads(pathlib.Path("macos/latest.json").read_text(encoding="utf-8"))
          assert latest["version"] == mac["version"], (latest["version"], mac["version"])
          latest["macos"] = mac["macos"]
          pathlib.Path("dist").mkdir()
          pathlib.Path("dist/latest.json").write_text(json.dumps(latest, indent=2) + "\n", encoding="utf-8")
      - name: Build provenance (public repositories)
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            windows/*.exe
            macos/*.dmg
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          win=$(ls windows/*.exe | head -n1); mac=$(ls macos/*.dmg | head -n1)
          win_sha=$(cut -d' ' -f1 "$win.sha256"); mac_sha=$(cut -d' ' -f1 "$mac.sha256")
          cat > notes.md <<EOF
          ### Windows
          Download **$(basename "$win")** and open it. It installs Jarvis for you only (no administrator rights), adds it to the Start Menu and opens it.

          Jarvis isn't code-signed, so Windows may say "Windows protected your PC": click **More info**, then **Run anyway**.
          To check the download, run \`Get-FileHash $(basename "$win")\` in PowerShell and compare it with this SHA-256:

          \`$win_sha\`

          ### Mac (Apple silicon, macOS 13 or later)
          Download **$(basename "$mac")** and open it, then drag **Jarvis** onto **Applications** (or open it from there and let Jarvis install itself on its last setup screen).

          Jarvis isn't notarized by Apple, so the first time macOS says it can't check it: open **System Settings › Privacy & Security**, scroll down and click **Open Anyway**, then **Open**.
          To check the download, run \`shasum -a 256 $(basename "$mac")\` in Terminal and compare it with this SHA-256:

          \`$mac_sha\`

          What changed: see CHANGELOG.md.
          EOF
          title="Jarvis $VERSION"
          if [[ "$TAG" == rehearsal-* ]]; then title="Rehearsal $TAG (Jarvis $VERSION): delete me"; fi
          flags=(--draft --target "$GITHUB_SHA" --title "$title" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" "$win" "$win.sha256" "$mac" "$mac.sha256" dist/latest.json "${flags[@]}"
