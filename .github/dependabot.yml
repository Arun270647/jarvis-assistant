# One grouped pull request per ecosystem and schedule.
# pip: Dependabot edits requirements.txt but not requirements.lock, which CI installs from. Its pull request fails
# tests/test_requirements_lock.py until the lock is regenerated (the command is in CONTRIBUTING.md), so take the
# version from the pull request and update both by hand. Minimum versions only move when a new version needs it.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm          # the website (website/package.json; Vercel builds each merge)
    directory: /website
    schedule:
      interval: monthly
    groups:
      website:
        patterns: ["*"]
    # Major versions wait for the tools around them (TypeScript 7 broke typescript-eslint, which Next's lint
    # config needs, in October 2026): take those by hand once `npm run build` and `npm run lint` pass.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
